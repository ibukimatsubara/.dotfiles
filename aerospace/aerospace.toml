# AeroSpace Configuration
# Hyprland-inspired tiling with visible rounded corners and outer gaps.

config-version = 2

start-at-login = true
auto-reload-config = true

# Keep workspace roots tiled when starting or changing windows/workspaces.
# The default alone does not reset a workspace's existing layout.
after-startup-command = ['layout --root tiles', 'exec-and-forget /bin/bash "$HOME/.dotfiles/scripts/aerospace-autotile.sh"']
on-focus-changed = ['layout --root tiles', 'exec-and-forget /bin/bash "$HOME/.dotfiles/scripts/aerospace-autotile.sh"']

# Keep SketchyBar workspace state synchronized with AeroSpace.
exec-on-workspace-change = ['/bin/bash', '-c',
    '$HOME/.dotfiles/scripts/aerospace-workspace-changed.sh "$AEROSPACE_FOCUSED_WORKSPACE"'
]

# Retain the single-window container prepared by split for the next window.
# Its direction comes from the tile's dimensions, not its parent's direction.
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

# Use tiles for automatically managed windows; utility windows float below.
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

automatically-unhide-macos-hidden-apps = false
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

# Keep windows away from the display edge so native rounded corners, blur,
# shadows, and JankyBorders remain visible even in AeroSpace fullscreen.
# The larger top gap reserves the SketchyBar footprint; the built-in display
# needs less room than external monitors.
gaps.inner.horizontal = 10
gaps.inner.vertical = 10
gaps.outer.left = 16
gaps.outer.bottom = 16
gaps.outer.top = [{ monitor.built-in = 32 }, 52]
gaps.outer.right = 16

# Apply the same guard when a window is created without changing focus.
[[on-window-detected]]
check-further-callbacks = true
run = 'layout --root tiles'

# Keep launcher and dictation utility windows floating so they do not consume
# a tile. Aqua Voice's recorder follows the focused workspace via the callback
# above, while its settings window remains a normal floating utility window.
[[on-window-detected]]
if = 'test %{app-bundle-id} = com.electron.aqua-voice || test %{app-bundle-id} = com.raycast.macos'
run = 'layout floating'

# Prepare newly detected tiled windows even when the app does not focus them.
# The helper always checks the actual focus and ignores floating/fullscreen.
[[on-window-detected]]
if = 'true'
run = 'exec-and-forget /bin/bash "$HOME/.dotfiles/scripts/aerospace-autotile.sh"'

[mode.main.binding]
    # Move only between tiled windows. Floating overlays such as Aqua Voice
    # and Raycast should not interrupt directional focus navigation.
    ctrl-cmd-h = 'focus --ignore-floating left'
    ctrl-cmd-j = 'focus --ignore-floating down'
    ctrl-cmd-k = 'focus --ignore-floating up'
    ctrl-cmd-l = 'focus --ignore-floating right'

    # AeroSpace fullscreen keeps the configured outer gaps by default.
    ctrl-f = 'fullscreen'

    # Cycle through workspaces without relying on their numeric names.
    ctrl-y = 'workspace --wrap-around prev'
    ctrl-o = 'workspace --wrap-around next'

    # Send the focused window to a numbered workspace.
    ctrl-shift-1 = 'move-node-to-workspace 1'
    ctrl-shift-2 = 'move-node-to-workspace 2'
    ctrl-shift-3 = 'move-node-to-workspace 3'
    ctrl-shift-4 = 'move-node-to-workspace 4'
    ctrl-shift-5 = 'move-node-to-workspace 5'
    ctrl-shift-6 = 'move-node-to-workspace 6'
    ctrl-shift-7 = 'move-node-to-workspace 7'
    ctrl-shift-8 = 'move-node-to-workspace 8'
    ctrl-shift-9 = 'move-node-to-workspace 9'
