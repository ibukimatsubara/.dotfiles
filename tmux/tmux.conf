# モーション設定（off にすると通常の即時操作へ戻る）
set -g @motion-enabled 'on'
set -g @motion-frames '2'
set -g @motion-frame-delay '0.001'
set -g @motion-codex-command "exec zsh -ic 'codexc; exec zsh -l'"

# Codexが15分ごとに直近の表示内容を要約してペイン下端へ表示する
set -g @pane-summary-enabled 'on'
set -g @pane-summary-model 'gpt-5.6-luna'
set -g @pane-summary-capture-lines '80'
set -g @pane-summary-max-input-chars '5000'
set -g @pane-summary-max-title-chars '34'
set -g @pane-summary-max-panes '12'
set -g @pane-summary-max-total-input-chars '60000'
set -g @pane-summary-timeout-seconds '240'
set -g @pane-summary-max-rss-mb '768'
set -g @pane-summary-max-output-bytes '16384'
set -g @pane-summary-watchdog-interval-seconds '5'
set -g @pane-summary-kill-grace-seconds '3'

# Ghostty の Cmd+T/W/R から送られる専用シーケンス
set -s user-keys[0] "\e[5;30001~"
set -s user-keys[1] "\e[5;30002~"
set -s user-keys[2] "\e[5;30003~"

# | で左右、- で上下に分割する
bind \\ run-shell -b '~/.dotfiles/scripts/tmux-motion.sh split-horizontal "#{pane_id}"'
bind - run-shell -b '~/.dotfiles/scripts/tmux-motion.sh split-vertical "#{pane_id}"'

# Cmd+T/Rはproject pickerから場所を選び、Cmd+Wは現在のペインを退避
unbind -n C-t
unbind -n C-w
bind -n User0 display-popup -E -w 80% -h 70% -d "#{pane_current_path}" -T " Open pane " '~/.dotfiles/scripts/tmux-project-picker.sh shell "#{pane_id}" #{q:pane_current_path}'
bind -n User1 run-shell -b '~/.dotfiles/scripts/tmux-motion.sh soft-close-pane "#{pane_id}"'
bind -n User2 display-popup -E -w 80% -h 70% -d "#{pane_current_path}" -T " Open Codex " '~/.dotfiles/scripts/tmux-project-picker.sh codex "#{pane_id}" #{q:pane_current_path}'

# 直前にCmd+Wで閉じたペインをプロセスごと復元（通常のsuspendより優先）
bind -n C-z run-shell -b '~/.dotfiles/scripts/tmux-motion.sh undo-last-pane "#{pane_id}"'

# exit したペインを短く残し、縮小してから閉じる
set -g remain-on-exit on
set -g remain-on-exit-format ''
set-hook -gu pane-exited
set-hook -g pane-died 'run-shell -b "~/.dotfiles/scripts/tmux-motion.sh close-pane #{hook_pane}"'
set-hook -g after-kill-pane 'run-shell "~/.dotfiles/scripts/tmux-balance-horizontal.sh #{hook_window}"'

# Vimのキーバインドでペインを移動する
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 256色端末 + Kittyのパススルーを許可（image.nvim用）
set -g default-terminal "tmux-256color"
# 修飾付きEnterなどの拡張キーをアプリへ渡す（Pi TUIなどで使用）
set -g extended-keys on
# Kittyのグラフィックパススルーを有効化（tmux 3.3+）
set -g allow-passthrough on
set -as terminal-overrides ',xterm-kitty*:Tc,RGB,AX,Ms,smglr@:smgt@:smgb@:allow-passthrough'
# 念のため全端末にパススルーを許可（非Kittyでも安全な設定）
set -as terminal-overrides ',*:allow-passthrough'

# status line の設定
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-style "fg=#c9d1d9,bg=default"
set -g message-style "fg=#0d1117,bg=#5eead4,bold"
set -g mode-style "fg=#0d1117,bg=#58a6ff,bold"
set -g popup-style "fg=#c9d1d9,bg=#161b22"
set -g popup-border-style "fg=#58a6ff,bg=#161b22"

# 番号詰め
set -g renumber-windows on

# 左にブランド、中央にセッション、右に場所と時刻を表示
setw -g window-status-format ""
setw -g window-status-current-format ""
set -g status-left-length 500
set -g status-left "#(~/.dotfiles/scripts/tmux-status-sessions.sh #{q:session_name} #{client_width} #{q:pane_current_path})"
set -g status-right ""
set -g status-right-length 0

# ペイン下端にコンテキストを表示し、アクティブを強調する
set -g pane-border-lines single
set -g pane-border-indicators colour
set -g pane-border-status bottom
set -g pane-border-format '#{?pane_active,#[fg=#5eead4] ● #[fg=#f0f6fc]#{?@pane-summary,#{@pane-summary},#{pane_current_command}} #[fg=#6e7681]· #{b:pane_current_path} ,#[fg=#484f58] #{pane_index} #[fg=#8b949e]#{?@pane-summary,#{@pane-summary},#{pane_current_command}} }'
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#5eead4'

# キーストロークのディレイを減らす (Escキーの反応を速くする)
set -sg escape-time 1

# スクロールバックの上限を抑える（暴走出力でtmuxが重くなるのを防ぐ）
set -g history-limit 10000
set -g mouse on

# マウスでのコピーモード改善
# macOSの場合: Optionキーを押しながらドラッグで通常のターミナル選択
# それ以外: tmuxのコピーモードを使用
setw -g mode-keys vi

# マウスドラッグで選択を開始（コピーモードに入る）
bind -n MouseDrag1Pane select-pane \; copy-mode -M

# クリップボードコマンドをOS別に設定
if-shell "uname | grep -q Darwin" \
    "set -g @clipboard_copy 'pbcopy'" \
    "set -g @clipboard_copy 'xclip -selection clipboard'"

# マウスドラッグ終了時にコピー
if-shell "uname | grep -q Darwin" \
    "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"

# ダブルクリックで単語選択してコピー
if-shell "uname | grep -q Darwin" \
    "bind -T copy-mode-vi DoubleClick1Pane select-pane \\; send-keys -X select-word \\; send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "bind -T copy-mode-vi DoubleClick1Pane select-pane \\; send-keys -X select-word \\; send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"

# トリプルクリックで行選択してコピー
if-shell "uname | grep -q Darwin" \
    "bind -T copy-mode-vi TripleClick1Pane select-pane \\; send-keys -X select-line \\; send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "bind -T copy-mode-vi TripleClick1Pane select-pane \\; send-keys -X select-line \\; send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"

# スクロールでコピーモードに入る
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"

# コピーモードのキーバインド
bind-key -T copy-mode-vi v send-keys -X begin-selection
if-shell "uname | grep -q Darwin" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"
if-shell "uname | grep -q Darwin" \
    "bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard'"

# ペーストのキーバインド
if-shell "uname | grep -q Darwin" \
    "bind ] run 'pbpaste | tmux load-buffer - && tmux paste-buffer'" \
    "bind ] run 'xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer'"

# fzfでセッション選択 (prefix + s)
bind s display-popup -E "tmux list-sessions -F '#{session_name}' | fzf --reverse --header='Switch Session' --preview='tmux capture-pane -ep -t {}' | xargs -I {} tmux switch-client -t {}"

# Prefixなしでセッションを巡回
unbind -n C-g
unbind -n C-f
unbind -n C-n
unbind -n C-p
bind -n C-u switch-client -p
bind -n C-i switch-client -n

# セッション切り替え直後にステータスバーを即再描画（連打してもハイライトが遅れないように）
set-hook -g client-session-changed 'refresh-client -S'

# prefix + m : 現在のペインを別セッションのアクティブウィンドウの「一番右のペイン」の右隣に移動
bind m display-popup -E "\
  cur=\$(tmux display -p '#S'); \
  target=\$(tmux list-sessions -F '#{session_name}' | grep -v \"^\${cur}\$\" | fzf --reverse --header='Move pane to session'); \
  [ -z \"\$target\" ] && exit; \
  rightmost=\$(tmux list-panes -t \"\${target}:\" -F '#{pane_right} #{session_name}:#{window_index}.#{pane_index}' | sort -rn | head -1 | awk '{print \$2}'); \
  tmux move-pane -h -t \"\$rightmost\"; \
  ~/.dotfiles/scripts/tmux-balance-horizontal.sh \"\${target}:\"; \
  ~/.dotfiles/scripts/tmux-balance-horizontal.sh \"\${cur}:\""

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sidebar'

# ヤンクの改善（システムクリップボードとの統合）
set -g @plugin 'tmux-plugins/tmux-yank'

# URL開く (Prefix + u でfzf選択)
set -g @plugin 'wfxr/tmux-fzf-url'

# セッション永続化
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-resurrect: Neovimのセッションも復元
set -g @resurrect-strategy-nvim 'session'
# tmux-resurrect: ペインの内容も復元
set -g @resurrect-capture-pane-contents 'on'

# tmux-continuum: 自動保存（15分ごと）
set -g @continuum-save-interval '15'
# tmux-continuum: tmux起動時に自動復元
set -g @continuum-restore 'on'

# 重要: status off でもcontinuumの自動保存を動かすためのフック
# status-rightはstatus offだと実行されないため、以下の方法で代替:
# 1. イベントフックで重要なタイミングで保存
set-hook -g client-attached 'run-shell -b "~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh"'
set-hook -g after-split-window 'run-shell -b "~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh"'
set-hook -g after-new-window 'run-shell -b "~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh"'
set-hook -g after-new-session 'run-shell -b "~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh"'
set-hook -g session-closed 'run-shell -b "~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh"'
# 2. バックグラウンドで定期保存スクリプトを起動（tmuxサーバー起動時に1回だけ）
run-shell -b 'pgrep -f "tmux-autosave.sh" >/dev/null || ~/.dotfiles/scripts/tmux-autosave.sh 900 &'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
