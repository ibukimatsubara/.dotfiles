# Ubuntu 26.04 / Hyprland 0.53.x (Hyprlang, not the 0.55 Lua format).
monitor = , preferred, auto, 1
source = ~/.dotfiles/platforms/ubuntu/hypr/conf/appearance.conf
source = ~/.dotfiles/platforms/ubuntu/hypr/conf/input.conf
source = ~/.dotfiles/platforms/ubuntu/hypr/conf/bindings.conf
source = ~/.dotfiles/platforms/ubuntu/hypr/conf/rules.conf
exec-once = ~/.dotfiles/scripts/hyprland-session.sh
exec-once = hyprctl dispatch workspace 1
