general {
    gaps_in = 10
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(5eead4ff)
    col.inactive_border = rgba(30363dff)
    layout = dwindle
}
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.015
        contrast = 0.95
        brightness = 0.85
        vibrancy = 0.22
        vibrancy_darkness = 0.2
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        offset = 0 4
        color = rgba(00000048)
        color_inactive = rgba(00000028)
    }
}
animations {
    enabled = true
    bezier = smooth, 0.2, 0.8, 0.2, 1.0
    animation = windows, 1, 3, smooth
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, smooth
}
dwindle {
    pseudotile = true
    preserve_split = true
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
