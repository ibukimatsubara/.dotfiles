general {
    gaps_in = 10
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(5eead4ff)
    col.inactive_border = rgba(30363dff)
    layout = dwindle
}
decoration {
    rounding = 12
    blur {
        enabled = true
        size = 2
        passes = 1
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000055)
    }
}
animations {
    enabled = true
    bezier = smooth, 0.2, 0.8, 0.2, 1.0
    animation = windows, 1, 3, smooth
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, smooth
}
dwindle {
    pseudotile = true
    preserve_split = true
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
