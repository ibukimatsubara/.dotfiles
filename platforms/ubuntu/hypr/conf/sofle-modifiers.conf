# Optional Sofle left Ctrl/Super profile; source after the shared bindings.
# Desktop shortcuts below preserve their original physical key positions.
# Load after the shared bindings and other local overrides.
# Regenerate/review this overlay when changing the shared shortcut definitions.

device {
    name = mtkb-w-sofle
    kb_options = ctrl:swap_lwin_lctl
}

device {
    name = mtkb-w-sofle-system-control
    kb_options = ctrl:swap_lwin_lctl
}

device {
    name = mtkb-w-sofle-consumer-control
    kb_options = ctrl:swap_lwin_lctl
}

# Remove the complete old set before adding swapped bindings.
unbind = SUPER, 1
unbind = SUPER, 2
unbind = SUPER, 3
unbind = SUPER, Return
unbind = SUPER, Space
unbind = SUPER SHIFT, Space
unbind = SUPER, comma
unbind = SUPER, N
unbind = SUPER SHIFT, V
unbind = SUPER, Y
unbind = SUPER, F
unbind = SUPER SHIFT, F
unbind = SUPER, Q
unbind = CTRL, Q
unbind = SUPER ALT, L
unbind = SUPER SHIFT, S
unbind = SUPER SHIFT, Escape
unbind = SUPER, mouse:272
unbind = SUPER, mouse:273
unbind = SUPER ALT, 1
unbind = CTRL SHIFT, 1
unbind = SUPER ALT, 2
unbind = CTRL SHIFT, 2
unbind = SUPER ALT, 3
unbind = CTRL SHIFT, 3
unbind = SUPER ALT, 4
unbind = CTRL SHIFT, 4
unbind = SUPER ALT, 5
unbind = CTRL SHIFT, 5
unbind = SUPER ALT, 6
unbind = CTRL SHIFT, 6
unbind = SUPER ALT, 7
unbind = CTRL SHIFT, 7
unbind = SUPER ALT, 8
unbind = CTRL SHIFT, 8
unbind = SUPER ALT, 9
unbind = CTRL SHIFT, 9
unbind = SUPER, P
unbind = SUPER SHIFT, P
unbind = CTRL, Y
unbind = CTRL, O
unbind = CTRL, F
unbind = CTRL, H
unbind = CTRL, J
unbind = CTRL, K
unbind = CTRL, L
unbind = CTRL, U
unbind = CTRL, I
unbind = SUPER SHIFT, 4
unbind = SUPER SHIFT, 3

# Rebind with the opposite logical modifier, retaining flags and actions.
bind = CTRL, 1, exec, ~/.dotfiles/scripts/hyprland-focus-or-open.sh ghostty
bind = CTRL, 2, exec, ~/.dotfiles/scripts/hyprland-focus-or-open.sh chrome
bind = CTRL, 3, exec, ~/.dotfiles/scripts/hyprland-focus-or-open.sh vscode
bind = CTRL, Return, exec, ~/.dotfiles/scripts/hyprland-focus-or-open.sh ghostty
bind = CTRL, Space, exec, ~/.dotfiles/scripts/ubuntu-desktop-shell.sh launcher
bind = CTRL SHIFT, Space, exec, ~/.dotfiles/scripts/ubuntu-desktop-shell.sh spotlight
bind = CTRL, comma, exec, ~/.dotfiles/scripts/ubuntu-desktop-shell.sh settings
bind = CTRL, N, exec, ~/.dotfiles/scripts/ubuntu-desktop-shell.sh notifications
bind = CTRL SHIFT, V, exec, vicinae deeplink vicinae://launch/clipboard/history
bind = CTRL, Y, exec, ~/.dotfiles/scripts/ubuntu-desktop-shell.sh wallpaper
bindp = CTRL, F, fullscreen, 1
bindp = CTRL SHIFT, F, togglefloating,
bindp = CTRL, Q, killactive,
bindp = SUPER, Q, killactive,
bind = CTRL ALT, L, exec, ~/.dotfiles/scripts/ubuntu-lock.sh
bind = CTRL SHIFT, S, exec, ~/.dotfiles/scripts/ubuntu-screenshot.sh
bind = CTRL SHIFT, Escape, exec, ~/.dotfiles/scripts/ubuntu-desktop-shell.sh powermenu
bindm = CTRL, mouse:272, movewindow
bindm = CTRL, mouse:273, resizewindow
bindp = CTRL ALT, 1, workspace, 1
bindp = SUPER SHIFT, 1, movetoworkspace, 1
bindp = CTRL ALT, 2, workspace, 2
bindp = SUPER SHIFT, 2, movetoworkspace, 2
bindp = CTRL ALT, 3, workspace, 3
bindp = SUPER SHIFT, 3, movetoworkspace, 3
bindp = CTRL ALT, 4, workspace, 4
bindp = SUPER SHIFT, 4, movetoworkspace, 4
bindp = CTRL ALT, 5, workspace, 5
bindp = SUPER SHIFT, 5, movetoworkspace, 5
bindp = CTRL ALT, 6, workspace, 6
bindp = SUPER SHIFT, 6, movetoworkspace, 6
bindp = CTRL ALT, 7, workspace, 7
bindp = SUPER SHIFT, 7, movetoworkspace, 7
bindp = CTRL ALT, 8, workspace, 8
bindp = SUPER SHIFT, 8, movetoworkspace, 8
bindp = CTRL ALT, 9, workspace, 9
bindp = SUPER SHIFT, 9, movetoworkspace, 9
bind = CTRL, P, exec, python3 ~/.dotfiles/scripts/ubuntu-break-timer.py toggle
bind = CTRL SHIFT, P, exec, python3 ~/.dotfiles/scripts/ubuntu-break-timer.py snooze
bindp = SUPER, Y, workspace, e-1
bindp = SUPER, O, workspace, e+1
bindp = SUPER, F, fullscreen, 1
bindp = SUPER, H, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py h --passthrough-modifiers SUPER
bindp = SUPER, J, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py j --passthrough-modifiers SUPER
bindp = SUPER, K, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py k --passthrough-modifiers SUPER
bindp = SUPER, L, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py l --passthrough-modifiers SUPER
bindp = SUPER, U, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py u --passthrough-modifiers SUPER
bindp = SUPER, I, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py i --passthrough-modifiers SUPER
bind = CTRL SHIFT, 4, exec, slurp | grim -g - - | wl-copy --type image/png
bind = CTRL SHIFT, 3, exec, grim - | wl-copy --type image/png

# Keep the original physical Ctrl+Space position for Japanese input.
bind = SUPER, Space, exec, fcitx5-remote -t

# Let terminal CLIs handle image paste while retaining normal text paste.
bindp = CTRL, V, exec, python3 ~/.dotfiles/scripts/hyprland-paste.py
