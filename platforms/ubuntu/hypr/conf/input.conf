input {
    kb_layout = us
    follow_mouse = 0
    repeat_delay = 250
    repeat_rate = 35
    touchpad {
        natural_scroll = true
    }
}
# Scope input-method settings to this session; leave GNOME/IBus unchanged.
env = GTK_IM_MODULE,
env = QT_IM_MODULES,wayland;fcitx;ibus
env = XMODIFIERS,@im=fcitx
env = QT_IM_MODULE,fcitx
env = XCURSOR_SIZE,24

# GDM does not read the interactive shell PATH (Ghostty/Vicinae live here).
env = PATH,$HOME/.local/bin:$HOME/.local/share/fnm:$PATH
