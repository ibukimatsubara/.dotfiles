# Keep the pointer visible while idle, typing, and using touch input.
cursor {
    # Software rendering avoids the disappearing hardware cursor on Ubuntu.
    no_hardware_cursors = 1
    # Bibata from Ubuntu provides the XCursor format.
    enable_hyprcursor = false
    inactive_timeout = 0
    hide_on_key_press = false
    hide_on_touch = false
}

input {
    kb_layout = us
    follow_mouse = 0
    left_handed = true
    natural_scroll = true
    sensitivity = -0.5
    repeat_delay = 250
    repeat_rate = 35
    touchpad {
        natural_scroll = true
    }
}
# Scope input-method settings to this session; leave GNOME/IBus unchanged.
env = GTK_IM_MODULE,
env = QT_IM_MODULES,wayland;fcitx;ibus
env = XMODIFIERS,@im=fcitx
env = QT_IM_MODULE,fcitx
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# GDM does not read the interactive shell PATH (Ghostty/Vicinae live here).
env = PATH,$HOME/.local/bin:$HOME/.local/share/fnm:$PATH
