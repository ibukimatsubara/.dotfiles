# Existing macOS app shortcuts take precedence over stock Super+number workspaces.
bind = SUPER, 1, exec, ~/.dotfiles/scripts/hyprland-focus-or-open.sh ghostty
bind = SUPER, 2, exec, ~/.dotfiles/scripts/hyprland-focus-or-open.sh chrome
bind = SUPER, 3, exec, ~/.dotfiles/scripts/hyprland-focus-or-open.sh vscode
bind = SUPER, Return, exec, ~/.dotfiles/scripts/hyprland-focus-or-open.sh ghostty
bind = SUPER, Space, exec, ~/.dotfiles/scripts/ubuntu-launcher.sh
bind = SUPER SHIFT, Space, exec, dms ipc call spotlight toggle
bind = SUPER, comma, exec, dms ipc call settings focusOrToggle
bind = SUPER, N, exec, dms ipc call notifications toggle
bind = SUPER SHIFT, V, exec, vicinae deeplink vicinae://launch/clipboard/history
bind = SUPER, Y, exec, dms ipc call dankdash wallpaper
bind = CTRL SUPER, H, movefocus, l
bind = CTRL SUPER, J, movefocus, d
bind = CTRL SUPER, K, movefocus, u
bind = CTRL SUPER, L, movefocus, r
bind = CTRL SUPER SHIFT, H, movewindow, l
bind = CTRL SUPER SHIFT, J, movewindow, d
bind = CTRL SUPER SHIFT, K, movewindow, u
bind = CTRL SUPER SHIFT, L, movewindow, r
bind = CTRL SUPER, Y, workspace, e-1
bind = CTRL SUPER, O, workspace, e+1
bind = SUPER, F, fullscreen, 1
bind = SUPER SHIFT, F, togglefloating,
bind = SUPER, Q, killactive,
bind = SUPER ALT, L, exec, ~/.dotfiles/scripts/ubuntu-lock.sh
bind = , Print, exec, ~/.dotfiles/scripts/ubuntu-screenshot.sh
bind = SUPER SHIFT, S, exec, ~/.dotfiles/scripts/ubuntu-screenshot.sh
bind = SUPER SHIFT, Escape, exec, dms ipc call powermenu toggle
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER ALT, 1, workspace, 1
bind = SUPER ALT SHIFT, 1, movetoworkspace, 1
bind = SUPER ALT, 2, workspace, 2
bind = SUPER ALT SHIFT, 2, movetoworkspace, 2
bind = SUPER ALT, 3, workspace, 3
bind = SUPER ALT SHIFT, 3, movetoworkspace, 3
bind = SUPER ALT, 4, workspace, 4
bind = SUPER ALT SHIFT, 4, movetoworkspace, 4
bind = SUPER ALT, 5, workspace, 5
bind = SUPER ALT SHIFT, 5, movetoworkspace, 5
bind = SUPER ALT, 6, workspace, 6
bind = SUPER ALT SHIFT, 6, movetoworkspace, 6
bind = SUPER ALT, 7, workspace, 7
bind = SUPER ALT SHIFT, 7, movetoworkspace, 7
bind = SUPER ALT, 8, workspace, 8
bind = SUPER ALT SHIFT, 8, movetoworkspace, 8
bind = SUPER ALT, 9, workspace, 9
bind = SUPER ALT SHIFT, 9, movetoworkspace, 9

# Shared desktop additions: timer actions and visual presets.
bind = SUPER, P, exec, python3 ~/.dotfiles/scripts/ubuntu-break-timer.py toggle
bind = SUPER SHIFT, P, exec, python3 ~/.dotfiles/scripts/ubuntu-break-timer.py snooze
bind = SUPER CTRL, P, exec, python3 ~/.dotfiles/scripts/ubuntu-break-timer.py stop
bind = SUPER CTRL ALT, T, exec, python3 ~/.dotfiles/scripts/desktop-theme.py pick
bind = SUPER CTRL ALT, N, exec, python3 ~/.dotfiles/scripts/desktop-theme.py next
bind = SUPER CTRL ALT, W, exec, python3 ~/.dotfiles/scripts/ubuntu-theme.py wallpaper

# Match AeroSpace/Hammerspoon navigation on macOS.
bind = CTRL, Y, workspace, e-1
bind = CTRL, O, workspace, e+1
bind = CTRL, F, fullscreen, 1
bind = CTRL, H, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py h
bind = CTRL, J, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py j
bind = CTRL, K, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py k
bind = CTRL, L, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py l
bind = CTRL, U, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py u
bind = CTRL, I, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py i
