# Existing macOS app shortcuts take precedence over stock Super+number workspaces.
bind = SUPER, 1, exec, ~/.dotfiles/scripts/hyprland-focus-or-open.sh ghostty
bind = SUPER, 2, exec, ~/.dotfiles/scripts/hyprland-focus-or-open.sh chrome
bind = SUPER, 3, exec, ~/.dotfiles/scripts/hyprland-focus-or-open.sh vscode
bind = SUPER, Return, exec, ~/.dotfiles/scripts/hyprland-focus-or-open.sh ghostty
bind = SUPER, Space, exec, ~/.dotfiles/scripts/ubuntu-desktop-shell.sh launcher
bind = SUPER SHIFT, Space, exec, ~/.dotfiles/scripts/ubuntu-desktop-shell.sh spotlight
bind = SUPER, comma, exec, ~/.dotfiles/scripts/ubuntu-desktop-shell.sh settings
bind = SUPER, N, exec, ~/.dotfiles/scripts/ubuntu-desktop-shell.sh notifications
bind = SUPER SHIFT, V, exec, vicinae deeplink vicinae://launch/clipboard/history
bind = SUPER, Y, exec, ~/.dotfiles/scripts/ubuntu-desktop-shell.sh wallpaper
bindp = CTRL SUPER, H, movefocus, l
bindp = CTRL SUPER, J, movefocus, d
bindp = CTRL SUPER, K, movefocus, u
bindp = CTRL SUPER, L, movefocus, r
bindp = CTRL SUPER SHIFT, H, movewindow, l
bindp = CTRL SUPER SHIFT, J, movewindow, d
bindp = CTRL SUPER SHIFT, K, movewindow, u
bindp = CTRL SUPER SHIFT, L, movewindow, r
bindp = CTRL SUPER, Y, workspace, e-1
bindp = CTRL SUPER, O, workspace, e+1
bindp = SUPER, F, fullscreen, 1
bindp = SUPER SHIFT, F, togglefloating,
bindp = SUPER, Q, killactive,
# Host window control must remain available in shortcut-inhibiting clients.
bindp = CTRL, Q, killactive,
bind = SUPER ALT, L, exec, ~/.dotfiles/scripts/ubuntu-lock.sh
bind = , Print, exec, ~/.dotfiles/scripts/ubuntu-screenshot.sh
bind = SUPER SHIFT, S, exec, ~/.dotfiles/scripts/ubuntu-screenshot.sh
bind = SUPER SHIFT, Escape, exec, ~/.dotfiles/scripts/ubuntu-desktop-shell.sh powermenu
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bindp = SUPER ALT, 1, workspace, 1
bindp = CTRL SHIFT, 1, movetoworkspace, 1
bindp = SUPER ALT, 2, workspace, 2
bindp = CTRL SHIFT, 2, movetoworkspace, 2
bindp = SUPER ALT, 3, workspace, 3
bindp = CTRL SHIFT, 3, movetoworkspace, 3
bindp = SUPER ALT, 4, workspace, 4
bindp = CTRL SHIFT, 4, movetoworkspace, 4
bindp = SUPER ALT, 5, workspace, 5
bindp = CTRL SHIFT, 5, movetoworkspace, 5
bindp = SUPER ALT, 6, workspace, 6
bindp = CTRL SHIFT, 6, movetoworkspace, 6
bindp = SUPER ALT, 7, workspace, 7
bindp = CTRL SHIFT, 7, movetoworkspace, 7
bindp = SUPER ALT, 8, workspace, 8
bindp = CTRL SHIFT, 8, movetoworkspace, 8
bindp = SUPER ALT, 9, workspace, 9
bindp = CTRL SHIFT, 9, movetoworkspace, 9

# Shared desktop additions: timer actions and visual presets.
bind = SUPER, P, exec, python3 ~/.dotfiles/scripts/ubuntu-break-timer.py toggle
bind = SUPER SHIFT, P, exec, python3 ~/.dotfiles/scripts/ubuntu-break-timer.py snooze
bind = SUPER CTRL, P, exec, python3 ~/.dotfiles/scripts/ubuntu-break-timer.py stop
bind = SUPER CTRL ALT, T, exec, python3 ~/.dotfiles/scripts/desktop-theme.py pick
bind = SUPER CTRL ALT, N, exec, python3 ~/.dotfiles/scripts/desktop-theme.py next
bind = SUPER CTRL ALT, W, exec, python3 ~/.dotfiles/scripts/ubuntu-theme.py wallpaper

# Match AeroSpace/Hammerspoon navigation on macOS.
bindp = CTRL, Y, workspace, e-1
bindp = CTRL, O, workspace, e+1
bindp = CTRL, F, fullscreen, 1
bindp = CTRL, H, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py h
bindp = CTRL, J, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py j
bindp = CTRL, K, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py k
bindp = CTRL, L, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py l
bindp = CTRL, U, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py u
bindp = CTRL, I, exec, python3 ~/.dotfiles/scripts/hyprland-navigation.py i
