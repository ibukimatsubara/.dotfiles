workspace = 1, persistent:true, default:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true
workspace = 6, persistent:true
workspace = 7, persistent:true
workspace = 8, persistent:true
workspace = 9, persistent:true

# 0.53 window rule syntax (validated by the installed compositor).
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol|pavucontrol|org.fcitx.fcitx5-config-qt)$
windowrule = float on, match:title ^(Open File|Save File|Save As)$

# Match dashboard terminals by app ID, including restarts outside the login helper.
# Initial focus suppression still allows normal clicking and keyboard focus.
windowrule = workspace 1 silent, tile on, no_initial_focus on, focus_on_activate off, match:class ^com\.dotfiles\.(pomoru|music|status)$
