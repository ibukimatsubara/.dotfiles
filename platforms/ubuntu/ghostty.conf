# Ubuntu / Linux configuration
window-decoration = none
mouse-shift-capture = always

# Keep normal Ctrl keys available to terminal applications.
keybind = clear
keybind = ctrl+shift+c=copy_to_clipboard
keybind = ctrl+shift+v=paste_from_clipboard
keybind = ctrl+shift+q=quit
keybind = ctrl+shift+n=new_window
keybind = ctrl+shift+comma=reload_config
# tmux user-keys configured in tmux/tmux.conf.
keybind = ctrl+shift+t=text:\x1b[5;30001~
keybind = ctrl+shift+w=text:\x1b[5;30002~
keybind = ctrl+shift+r=text:\x1b[5;30003~

custom-shader-animation = false

# Optional shared visual preset.
config-file = ?~/.config/desktop-theme/current/ghostty.conf
config-file = ?~/.config/desktop-theme/current/ubuntu-ghostty.conf

font-size = 11

# macOS Command maps to Super on Ubuntu; compositor owns Super+Q.
keybind = super+v=paste_from_clipboard
keybind = super+w=close_window
keybind = super+t=text:\x1b[5;30001~
keybind = super+r=text:\x1b[5;30003~
keybind = ctrl+alt+super+r=reload_config
keybind = ctrl+alt+super+m=toggle_mouse_reporting
working-directory = home
window-inherit-working-directory = false
