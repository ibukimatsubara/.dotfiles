# Shared appearance and terminal settings.
theme = GitHub Dark
foreground = #e6e6e6
font-family = Hack Nerd Font Mono
font-size = 14
background-opacity = 0.78
background-opacity-cells = true
window-padding-x = 12
window-padding-y = 10
window-padding-balance = true
link-url = true
term = xterm-256color
cursor-style = block
